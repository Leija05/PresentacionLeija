<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Página Personal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>

    <header>
        <h1>Hola, soy Hector Leija</h1>
        <p>Bienvenido a mi página personal</p>
        <button onclick="toggleTheme()">🌙 / ☀️ Tema</button>
    </header>

    <section>
        <h2>Sobre mí</h2>
        <div class="buttons">
            <button onclick="openModal('sobreMi')">👤 Mas Sobre mí</button>
            <button onclick="openModal('estudios')">📚 Estudios</button>
            <button onclick="openModal('timeline')">⏳ Mi camino</button>
            <button onclick="openModal('juegos')">🎮 Juegos</button>
            <button onclick="openModal('musica')">🎵 Música</button>
            <button onclick="openModal('contacto')">📬 Contacto</button>
        </div>
    </section>


    <section>
        <h2>Lo que estoy aprendiendo</h2>
        <div class="buttons">
            <button onclick="openModal('C#')">C#</button>
            <button onclick="openModal('html')">HTML</button>
            <button onclick="openModal('css')">CSS</button>
            <button onclick="openModal('js')">JavaScript</button>
        </div>
    </section>

   <footer>
        <p>© 2026 Hector Leija</p>
        <p>Aprendiendo programación paso a paso</p>
    </footer>


    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
