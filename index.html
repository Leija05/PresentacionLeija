<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Página Personal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta property="og:title" content="Hector Leija | Portafolio">
    <meta property="og:description" content="Estudiante de Ingeniería en Sistemas y programador en formación">
    <meta property="og:image" content="preview.png">

</head>

<body>

    <header>
        <div class="hero-avatar-wrapper" onclick="openModal('contacto')">
            <span class="avatar-contact-icon">☎️</span>

            <img src="https://i.imgur.com/obsuT25.jpeg" alt="Avatar de Hector Leija" class="hero-avatar">
        </div>

        <h1>Hola, soy Hector Leija</h1>
        <p>Estudiante de Ingeniería en Sistemas · Programador en formación</p>
        <br>
        <button class="nav-theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
    </header>

    <section>
        <h2>Sobre mí</h2>
        <div class="buttons">
            <button onclick="openModal('sobreMi')">👤 Mas Sobre mí</button>
            <button onclick="openModal('estudios')">📚 Estudios</button>
            <button onclick="openModal('timeline')">⏳ Mi camino</button>
            <button onclick="openModal('juegos')">🎮 Juegos</button>
            <button onclick="openModal('musica')">🎵 Música</button>
            <button onclick="openModal('contacto')">📬 Contacto</button>
        </div>
    </section>

    <section>
        <h2>Lo que estoy aprendiendo</h2>
        <div class="buttons skills">

            <button onclick="openModal('C#')" class="skill-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/csharp/csharp-plain.svg" alt="C#">
            </button>

            <button onclick="openModal('html')" class="skill-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-plain.svg" alt="HTML">
            </button>

            <button onclick="openModal('css')" class="skill-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-plain.svg" alt="CSS">
            </button>

            <button onclick="openModal('js')" class="skill-btn">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-plain.svg" alt="JavaScript">
            </button>

        </div>
    </section>

   <footer>
        <p>© 2026 Hector Leija</p>
        <p>Aprendiendo programación paso a paso</p>
        <p class="visit-counter">
          👀 Visitantes activos
        </p>

    </footer>


    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>
    <script src="app.js"></script>
</body> 

</html>
